<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dicsőítő daltár</title>
  <meta name="description" content="Dicsőítő dalok szöveggel és akkordokkal — kereshető, megtekinthető és PDF-ben letölthető." />

  <!-- Betűtípusok (internet szükséges hozzá; offline szép rendszer-betűre vált) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="aura" aria-hidden="true"></div>

  <header class="site wrap">
    <h1 class="site-title">Dicsőítő <em>daltár</em></h1>
    <button id="themeToggle" class="theme-toggle" aria-label="Sötét mód váltása" title="Sötét/világos mód">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>
  </header>

  <div class="controls">
    <div class="wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search" type="text" placeholder="Keresés cím vagy szövegrészlet alapján…" autocomplete="off" />
        <button id="clearSearch" class="clear-btn" aria-label="Törlés">×</button>
      </div>

      <div class="filters">
        <div class="filter-group">
          <span class="filter-label">Tempó</span>
          <div id="tempoFilters" class="chip-row"></div>
        </div>
      </div>
    </div>
  </div>

  <main class="wrap">
    <div id="resultCount" class="result-count"></div>
    <ul id="songList" class="song-list"></ul>
  </main>

  <footer class="site-footer wrap">
    <span>Dicsőítő daltár</span>
  </footer>

  <!-- Dal nézet -->
  <div id="overlay" class="overlay">
    <div id="sheet" class="sheet"></div>
  </div>

  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
